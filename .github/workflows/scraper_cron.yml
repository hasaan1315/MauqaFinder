name: Daily Scraper Sync

on:
  schedule:
    # Runs at 01:17 UTC (6:17 AM Pakistan Standard Time) - Off-peak to avoid GitHub queue delays
    - cron: '17 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml supabase python-dotenv

      - name: Run Master Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          python sync_all.py