<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MauqaFinder pipeline architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1000" height="420" rx="16" fill="#0f172a"/>

  <!-- trigger -->
  <rect x="270" y="14" width="210" height="52" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="375" y="36" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">cron-job.org</text>
  <text x="375" y="54" text-anchor="middle" fill="#94a3b8" font-size="11">Daily · 06:13 AM PKT</text>
  <line x1="375" y1="66" x2="375" y2="94" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="387" y="84" fill="#fbbf24" font-size="10.5">POST /dispatches · Bearer PAT</text>

  <!-- sources -->
  <text x="105" y="128" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1">SOURCES</text>
  <rect x="30" y="150" width="150" height="50" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="105" y="171" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">NJP</text>
  <text x="105" y="188" text-anchor="middle" fill="#94a3b8" font-size="11">Govt job portal</text>
  <rect x="30" y="225" width="150" height="50" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="105" y="246" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">PPSC</text>
  <text x="105" y="263" text-anchor="middle" fill="#94a3b8" font-size="11">Punjab commission</text>
  <line x1="180" y1="175" x2="250" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="250" x2="250" y2="250" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="166" text-anchor="middle" fill="#94a3b8" font-size="10">HTML/JSON</text>

  <!-- runner container -->
  <rect x="250" y="94" width="250" height="290" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="375" y="116" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">GitHub Actions · ubuntu-latest</text>

  <rect x="275" y="130" width="200" height="44" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="375" y="157" text-anchor="middle" fill="#f8fafc" font-size="13">1 · Fetch &amp; parse DOM</text>
  <line x1="375" y1="174" x2="375" y2="188" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <rect x="275" y="190" width="200" height="44" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="375" y="217" text-anchor="middle" fill="#f8fafc" font-size="13">2 · Cleanse fields</text>
  <line x1="375" y1="234" x2="375" y2="248" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <rect x="275" y="250" width="200" height="44" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="375" y="277" text-anchor="middle" fill="#f8fafc" font-size="13">3 · Normalize schema</text>
  <line x1="375" y1="294" x2="375" y2="308" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <rect x="275" y="310" width="200" height="44" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="375" y="337" text-anchor="middle" fill="#f8fafc" font-size="13">4 · Deduplicate</text>

  <!-- outputs -->
  <text x="675" y="128" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1">OUTPUTS</text>
  <line x1="475" y1="332" x2="520" y2="332" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M500,332 H545 V180 H590" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M545,332 V280 H590" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="552" y="172" fill="#22c55e" font-size="10">API upsert</text>
  <text x="552" y="272" fill="#a78bfa" font-size="10">export</text>

  <rect x="590" y="150" width="170" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="675" y="175" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Supabase</text>
  <text x="675" y="193" text-anchor="middle" fill="#94a3b8" font-size="11">PostgreSQL</text>

  <rect x="590" y="250" width="170" height="60" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="675" y="275" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Artifacts</text>
  <text x="675" y="293" text-anchor="middle" fill="#94a3b8" font-size="11">.json + .sql backups</text>

  <!-- app -->
  <text x="895" y="128" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1">CONSUMER</text>
  <line x1="760" y1="180" x2="820" y2="180" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="171" text-anchor="middle" fill="#22c55e" font-size="10">read</text>
  <rect x="820" y="150" width="150" height="60" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="895" y="175" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">MauqaFinder</text>
  <text x="895" y="193" text-anchor="middle" fill="#94a3b8" font-size="11">SaaS app</text>
</svg>
